name: Pipeline Cartola FC

on:
  workflow_dispatch:

jobs:
  testar-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar bibliotecas
        run: |
          pip install pandas numpy scipy requests

      - name: Verificar arquivos
        run: |
          ls -la
          echo "=== ARQUIVOS ENCONTRADOS ==="
          python -c "import os; print(os.listdir('.'))"

      - name: Testar pipeline
        run: |
          echo "Rodando pipeline..."
          python pipeline_semanal.py --rodada 27 --etapa pre_rodada || echo "Pipeline falhou, mas continuamos"
