name: Teste Cartola

on:
  workflow_dispatch:

jobs:
  teste:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Listar arquivos
        run: ls -la
      - name: Ver Python
        run: python --version
